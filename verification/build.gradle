// These tests do not load Minecraft or Fabric. A separate full build is still required.
plugins { id 'java' }
repositories { mavenCentral() }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
}
sourceSets {
    main {
        java {
            srcDirs = ['../src/main/java']
            include 'dev/negradlc/config/**'
            include 'dev/negradlc/combat/CombatMath.java'
            include 'dev/negradlc/combat/FallTracker.java'
            include 'dev/negradlc/combat/RotationStepper.java'
            include 'dev/negradlc/combat/AuraViewSession.java'
            include 'dev/negradlc/combat/TargetDwell.java'
            include 'dev/negradlc/movement/MovementMath.java'
            include 'dev/negradlc/input/BindingCodes.java'
            include 'dev/negradlc/input/WheelAccumulator.java'
            include 'dev/negradlc/visuals/ScreenProjection.java'
            include 'dev/negradlc/visuals/EffectGeometry.java'
            include 'dev/negradlc/visuals/AmbienceMath.java'
        }
    }
    test { java.srcDirs = ['../src/test/java'] }
}
test { useJUnitPlatform() }
